name: Check German career pages
on:
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"   # Six checks daily, UTC (GitHub may delay runs)
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send one test email to verify alert setup"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "german-job-monitor"
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check public job feeds
        run: python monitor.py
      - name: Add eligibility and worksite review flags
        run: python screening.py
      - name: Add evidence-led technical overlap and gap notes
        run: python fit_review.py
      - name: Review main responsibilities and specialized requirements
        run: python core_review.py
      - name: Separate job city, state and country
        run: python location_detail.py
      - name: Count documented expertise, method and general overlaps
        run: python competency_review.py
      - name: Distinguish explicit, preferred and unspecified qualifications
        run: python qualification_priority.py
      - name: Email new high-priority vacancies
        # A mail-provider outage must not prevent the public dashboard from updating.
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python notify.py
      - name: Save detection and notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update German job monitoring snapshot"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
