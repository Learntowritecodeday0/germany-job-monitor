name: Validate parser and shortlist changes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Unit and frontend regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python parser and screening tests
        run: python -m unittest discover -s tests -v
      - name: Test browser shortlist on current job snapshot
        run: |
          node tests/test_shortlist_primary_duties.cjs
          node tests/test_shortlist.cjs
          node tests/test_theme_frontend.cjs
